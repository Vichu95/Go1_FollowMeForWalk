global_costmap:
   global_frame: map
   robot_base_frame: base
   transform_tolerance: 0.5
   update_frequency: 2.0
   publish_frequency: 2.0
   # static_map: true
   width: 40.0
   height: 40.0
   resolution: 0.1
   origin_x: 0.0
   origin_y: 0.0
   rolling_window: false

   plugins:
      - {name: static_layer, type: "costmap_2d::StaticLayer"}




   static_layer:
      enabled: true
      map_topic: "/map"
      subscribe_to_updates : True      