<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Follow Me App</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        /* CSS for positioning elements */
        body {
            margin: 0; /* Reset default margin */
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center; /* Center items horizontally */
            justify-content: center; /* Center items vertically */           
        }
        h1 {
            color: #5018d4; /* Change heading color to blue */
            font-size: 1.5cm;
        }
        #content {
            display: flex;
            justify-content: space-between; /* Distribute items evenly */
            width: 80%; /* Set width of content */
            margin-top: 20px; /* Add space between header and content */
        }
        .column {
            width: 45%; /* Set width of each column */
        }
        .text-bold {
            font-weight: bold; /* Make text bold */
        }
        #video-container {
            margin-bottom: 20px; /* Add space below video */
        }
        #button-container {
            margin-top: 20px; /* Add space above button */
        }
        #stop_button {
            padding: 15px 30px; /* Increase padding for height */
            width: 100%; /* Make button wider */
            font-size: 30px;
            background-color: red; /* Set background color to red */
            color: black; /* Set text color to black */
            border: none;
            cursor: pointer;
            font-weight: bold; /* Make text bold */
        }
    </style>
</head>
<body>
    <h1>Follow Me</h1>





    <div id="content">
        <div class="column">
            <div id="text-container">
                <p class="text-bold">Objects detected :{{ webapp_var_objdetected }}</p>
                <p class="text-bold">Second line of text</p>
                <p class="text-bold">Third line of text</p>
            </div>
        </div>
        <div class="column">
            <div id="text-container">
                <p class="text-bold">First line of text</p>
                <p class="text-bold">Second line of text</p>
                <p class="text-bold">Third line of text</p>
            </div>
        </div>
    </div>






    <div id="button-container">
        <button id="triggerButton" onclick="triggerValue()">Trigger Value</button>

    </div>


    <div id="video-container">
        <img id="video" src="{{ url_for('video_feed') }}">
    </div>



    <script>
        function triggerValue() {
            fetch('/trigger_value', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ value: 'STOP' })
            })
            .then(response => {
                if (response.ok) {
                    console.log("Value triggered successfully");
                } else {
                    console.error("Failed to trigger value");
                }
            })
            .catch(error => {
                console.error("Error triggering value:", error);
            });
        }
    </script>

    <script>
        // Function to reload the page every 5 seconds
        setInterval(function() {
            location.reload();
        }, 500); // Adjust the interval as needed (e.g., every 5 seconds)
    </script>
</body>
</html>
