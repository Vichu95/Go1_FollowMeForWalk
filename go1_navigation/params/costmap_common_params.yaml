origin_z: 0.0
z_resolution: 1.0
z_voxels: 3

resolution: 1.0

obstacle_range: 5.0
raytrace_range: 7.0

publish_voxel_map: true
transform_tolerance: 0.5
meter_scoring: true

always_send_full_costmap: true

# As per go1 spec : standing L*W*H  0.645*0.28*0.4m
footprint: [[-0.36, -0.17], [-0.36, 0.17], [0.36, 0.17], [0.36, -0.17]]
footprint_padding: 0.1

plugins:
  - { name: obstacles_layer, type: "costmap_2d::ObstacleLayer" }
  #- { name: dynamic_obstacle_layer, type: "dynamic_obstacle_layer::DynamicLayer"} # Uncomment to apply dynamic_obstacle_layer
  - { name: inflater_layer,  type: "costmap_2d::InflationLayer"}

obstacles_layer:
  observation_sources: scan
  track_unknown_space: true
  scan:
    {
      sensor_frame: robosense,
      data_type: PointCloud2,
      topic: /go1/rslidar_points,
      marking: true,
      clearing: true,
      inf_is_valid: False,
      # combination_method: 0,
      min_obstacle_height: 0.1,
      max_obstacle_height: 5,
      obstacle_range: 5.0, #if beyond this threshold, then will not mark as obstacle
      raytrace_range: 2.0 #5.0 Lower this value to detect nearer obstacles with better accuracy
    }

dynamic_obstacle_layer:
    enabled: True
    map_tolerance: 0.2
    footprint_radius: 0.3
    range: 5.0

inflater_layer:
    enabled: true
    cost_scaling_factor: 3.0 
    inflation_radius: 0.35 #0.45 #Minimum value: 0.379

