<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Follow Me App</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        /* CSS for positioning elements */
        body {
            margin: 0; /* Reset default margin */
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center; /* Center items horizontally */
            justify-content: center; /* Center items vertically */           
        }
        h1 {
            color: #5018d4; /* Change heading color to blue */
            font-size: 1.5cm;
        }
        .column {
            width: 45%; /* Set width of each column */
        }
        .text-bold {
            font-weight: bold; /* Make text bold */
        }
        #video-container {
            margin-bottom: 20px; /* Add space below video */
        }
        #button-container {
            margin-top: 20px; /* Add space above button */
        }
        #executeButton {
            padding: 15px 30px; /* Increase padding for height */
            width: 100%; /* Make button wider */
            font-size: 30px;
            background-color: red; /* Set background color to red */
            color: black; /* Set text color to black */
            border: none;
            cursor: pointer;
            font-weight: bold; /* Make text bold */
        }
    </style>
</head>
<body>
    <h1>Follow Me</h1>





    <div id="video-container">
        <img id="video" src="{{ url_for('video_feed') }}">
    </div>



    <div id="button-container">
        <button id="executeButton">Run Script</button>
    </div>

    <div id="result-container">
        <!-- Script execution result will be displayed here -->
    </div>

    <script>
        $(document).ready(function() {
            $('#executeButton').click(function() {
                // Send a POST request to execute the script
                $.post('/execute_script', function(data) {
                    // Display the result on the page
                    $('#result-container').html(data.status);
                });
            });
        });
    </script>

</body>
</html>
